uery\":\"$1fd\",\"docs\":\"$206\",\"oldDocs\":\"$218\",\"docChanges\":\"$21b\",\"mutatedKeys\":\"$a8\",\"fromCache\":false,\"syncStateChanged\":true,\"excludesMetadataChanges\":false,\"hasCachedResults\":true,\"\":\"$Pad\"}\n21c:[[\"Home\",\"/Users/rcorreas/FLA10/fla10news/.next/server/chunks/ssr/[root-of-the-server]__1f9f9ccc._.js\",1227,285,1197,1,false]]\n21d:[[\"Home\",\"/Users/rcorreas/FLA10/fla10news/.next/server/chunks/ssr/[root-of-the-server]__1f9f9ccc._.js\",1229,286,1197,1,false]]\n21e:[[\"Home\",\"/Users/rcorreas/FLA10/fla10news/.next/server/chunks/ssr/[root-of-the-server]__1f9f9ccc._.js\",1230,300,1197,1,false]]\n38:D{\"awaited\":\"$f4\",\"env\":\"Server\",\"owner\":\"$39\",\"stack\":\"$f7\"}\n38:D{\"awaited\":\"$f8\",\"env\":\"Server\",\"owner\":\"$39\",\"stack\":\"$fb\"}\n38:D{\"awaited\":\"$fc\",\"env\":\"Server\",\"owner\":\"$39\",\"stack\":\"$ff\"}\n38:D{\"awaited\":\"$100\",\"env\":\"Server\",\"owner\":\"$39\",\"stack\":\"$103\"}\n220:Tebe,"])</script><script>self.__next_f.push([1,"O presidente do Flamengo, Luiz Eduardo Baptista, o Bap, surpreendeu ao admitir publicamente um erro de mercado envolvendo uma negociação recente do clube. Durante entrevista, o dirigente reconheceu que o Rubro-Negro falhou ao liberar o atacante Juninho, que atualmente vive grande fase no futebol mexicano defendendo o Pumas.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\n“Foi erro nosso”, declarou Bap ao comentar a saída do jogador, em uma fala que rapidamente repercutiu entre torcedores e movimentou os bastidores do clube.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA declaração chamou atenção justamente porque o Flamengo raramente admite publicamente equívocos em negociações envolvendo atletas formados ou desenvolvidos pelo clube.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nJuninho deixou o Rubro-Negro sem grande destaque no elenco principal e acabou encontrando espaço no futebol mexicano, onde passou a viver o melhor momento da carreira. No Pumas, o atacante ganhou sequência, confiança e virou um dos nomes mais elogiados da equipe na temporada.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNos bastidores da Gávea, existe hoje a percepção de que o clube poderia ter administrado melhor o desenvolvimento do jogador antes da saída definitiva.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nInternamente, dirigentes reconhecem que o Flamengo enfrentou dificuldades nos últimos anos para oferecer minutagem adequada a jovens atacantes em meio à pressão constante por resultados imediatos e à presença de nomes experientes no elenco principal.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA situação de Juninho reacendeu debates antigos dentro do clube sobre aproveitamento da base e gestão de jovens talentos.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nParte da torcida passou a questionar se o Flamengo vem conseguindo equilibrar corretamente a necessidade de competitividade imediata com o desenvolvimento de atletas formados no Ninho do Urubu.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nO tema ganhou ainda mais repercussão porque o Flamengo continua sendo uma das maiores fábricas de talentos do futebol sul-americano, revelando jogadores constantemente monitorados pelo mercado internacional.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNos últimos anos, o clube acumulou vendas milionárias envolvendo atletas como Vinícius Júnior, Lucas Paquetá, Reinier, João Gomes e Matheus França.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nMesmo assim, alguns casos específicos seguem gerando discussões internas sobre decisões tomadas no processo de transição entre base e profissional.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA fala de Bap também foi interpretada como sinal de autocrítica em meio à pressão crescente vivida pelo clube após a eliminação precoce na Copa do Brasil.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nInternamente, o Flamengo atravessa momento de forte cobrança sobre planejamento esportivo, montagem de elenco e decisões de mercado tomadas nas últimas temporadas.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA diretoria já vinha sendo pressionada por parte da torcida após problemas ofensivos apresentados pelo time em jogos decisivos recentes.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNesse cenário, o bom momento de Juninho no México acabou aumentando ainda mais o peso simbólico da declaração do presidente rubro-negro.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNas redes sociais, torcedores dividiram opiniões. Parte da torcida elogiou a sinceridade de Bap ao admitir a falha, enquanto outros utilizaram a fala para reforçar críticas à gestão do futebol do clube.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nEnquanto isso, Juninho segue valorizado no mercado mexicano e começa a atrair interesse de outros clubes do exterior após a sequência positiva no Pumas.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNo Flamengo, a expectativa é de que episódios como esse sirvam de aprendizado para futuras decisões envolvendo jovens talentos da base.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nE em um clube acostumado a movimentar cifras milionárias no mercado da bola, a admissão pública de um erro raro acabou revelando também o tamanho da pressão existente nos bastidores da Gávea."])</script><script>self.__next_f.push([1,"221:T1d6e,"])</script><script>self.__next_f.push([1,"Lucas Paquetá abriu o coração em uma entrevista especial ao Mengocast, da Flamengo TV, em que falou sobre o retorno ao clube que o revelou, os bastidores da negociação com o West Ham, a relação com ídolos e treinadores europeus e o sonho de viver uma Copa do Mundo vestindo o manto rubro-negro.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eRetorno ao Flamengo e “eu preciso do Flamengo”\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nNa conversa com o narrador João Guilherme, Paquetá descreve a volta ao Flamengo como “melhor do que imaginava” e afirma que buscava, acima de tudo, voltar a se sentir em casa e feliz.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle revela que a frase “eu preciso do Flamengo” nasceu depois de anos na Europa e de um processo de julgamento que abalou profundamente sua vida pessoal e familiar, levando-o a buscar um lugar onde se sentisse novamente abraçado.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eProcesso na Europa e fé em meio às incertezas\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nO meia relata que os últimos três anos, marcados por uma investigação e risco até de banimento, mexeram com sua cabeça e com a de sua esposa, cercados por rumores, prazos e previsões sombrias sobre o fim de sua carreira.\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá diz que se agarrou à fé, interpretando o período difícil como parte de um propósito maior, e afirma ver a volta ao Flamengo, como maior contratação da história do futebol brasileiro, como algo que supera até o que havia pedido a Deus.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eNegociação longa, resistência do West Ham e decisão pelo coração\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá conta que a primeira sondagem para voltar ocorreu ainda em 2023, com Marcos Braz indo à sua casa, mas ele decidiu esperar o desfecho do processo antes de mudar de clube.\u003cbr\u003e\r\n\u003cbr\u003e\r\nNa janela seguinte, já com José Boto e o presidente do Flamengo envolvidos, a negociação se arrastou por cerca de 30 dias, enfrentando forte resistência do West Ham e de um treinador que o tinha como homem de confiança, mas Paquetá diz ter seguido “o que o coração mandava”.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eVínculo com a geração vencedora e estrutura atual do clube\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nDe volta ao Ninho do Urubu, o meia se impressiona com a estrutura “maravilhosa” e com um elenco recheado de jogadores consagrados, muitos já ídolos do clube.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle lembra que deixou o Flamengo em dezembro de 2018, pouco antes da explosão de títulos de 2019, e hoje celebra poder dividir o vestiário com nomes como Arrascaeta e Bruno Henrique, a quem chama de ídolos com quem sempre sonhou jogar.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eAmizade com Pedro e sonho da dupla com Vinícius Júnior\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá destaca a proximidade com Pedro, amigo desde a base rubro-negra, com quem ia à escola e jogava junto dos 9 aos 12 anos, e diz que a conexão de ambos facilita a parceria dentro de campo.\u003cbr\u003e\r\n\u003cbr\u003e\r\nSobre Vinícius Júnior, ele revela que o atacante do Real Madrid estava “mais ansioso” do que ele pela volta ao Flamengo, mandando mensagens diárias e até brincando em “completar” o valor para o West Ham liberar, além de prever um reencontro da dupla no Maracanã “na hora certa”.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eGuardiola, Ancelotti e quase acerto com o Manchester City\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nNa entrevista, Paquetá confirma que esteve muito perto de assinar com o Manchester City antes do avanço da investigação que o envolvia, em uma negociação que, segundo ele, estava “praticamente certa” para aquela semana.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle conta que Pep Guardiola sempre elogiou seu entendimento de jogo e queria tê-lo no City, e comenta também a admiração de Carlo Ancelotti, hoje técnico da seleção brasileira, dizendo considerar um privilégio trabalhar com um treinador desse nível.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eTécnico Leonardo Jardim e adaptação ao novo Flamengo\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nO meio-campista avalia positivamente o trabalho do técnico Leonardo Jardim, descrevendo-o como um treinador exigente, que “nunca está satisfeito” e cobra constantemente evolução, inclusive após atuações muito boas.\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá relata um episódio em que, mesmo após marcar gol na Libertadores e fazer um grande jogo, ouviu do treinador uma crítica pontual a um passe errado, algo que ele vê como um estímulo para buscar um nível ainda mais alto.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eLesão recente, apoio da comissão e volta programada\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nAo comentar a lesão sofrida recentemente, Paquetá relembra a preocupação inicial com a dor diferente no joelho e destaca a postura positiva de Jardim, que foi um dos primeiros a abraçá-lo em campo e minimizar o medo naquele momento.\u003cbr\u003e\r\n\u003cbr\u003e\r\nNa gravação, feita às vésperas de sua volta aos gramados, ele manda um recado direto à torcida, garantindo que está melhorando “aos pouquinhos” e que estará de volta em breve para ajudar o time.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eVersatilidade em campo e funções preferidas\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá se define como um jogador versátil, capaz de atuar como segundo volante, meia mais avançado ou até como falso atacante, funções que já exerceu ao longo da carreira e também nesta nova passagem pelo Flamengo.\u003cbr\u003e\r\n\u003cbr\u003e\r\nApesar disso, ele afirma se sentir mais à vontade no meio-campo, seja como segundo volante ou meia centralizado, onde pode participar mais do jogo, marcar, disputar duelos e, assim, potencializar seu desempenho com a bola.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eVisão sobre o futebol brasileiro e comparação com ligas europeias\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nCom passagens por França, Itália e Inglaterra, Paquetá vê o futebol brasileiro mais competitivo do que em 2018, com mais jogadores retornando da Europa e elevando o nível técnico e de vivência.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle aponta, porém, que a qualidade dos gramados ainda distancia o Brasil das grandes ligas, já que campos melhores tornam o jogo mais rápido e fluido, e defende partidas com menos interrupções e faltas para aproximar o ritmo do que se vê na Premier League.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eTítulos, Mundial e sonho de Copa com o manto rubro-negro\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nSobre objetivos, Paquetá não esconde a ambição: quer disputar e ganhar tudo o que for possível com o Flamengo, citando especificamente Campeonato Brasileiro, Libertadores e o sonho de conquistar um Mundial.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle também revela um desejo pessoal especial: jogar a próxima Copa do Mundo representando o Flamengo, algo que considera simbólico depois de ter disputado o torneio anterior quando ainda atuava na Europa.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003eMemórias marcantes, finais e contas com o passado\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nO jogador lembra com carinho da histórica final da Libertadores de 2019, quando, já no Milan, assistiu de casa, entre frio e nervosismo, à virada sobre o River Plate com dois gols de Gabriel Barbosa.\u003cbr\u003e\r\n\u003cbr\u003e\r\nQuestionado sobre um jogo que gostaria de disputar novamente, ele cita a final da Sul-Americana de 2017, na qual marcou gol atuando como falso 9, mas lamenta não ter saído campeão, dizendo que faria de tudo para ter uma segunda chance naquele título.\u003cbr\u003e\r\n\u003cbr\u003e\r\n\u003cb\u003ePeso de ser a maior contratação e relação com a torcida\u003c/b\u003e\u003cbr\u003e\r\n\u003cbr\u003e\r\nPaquetá admite que o rótulo de maior contratação da história do futebol brasileiro traz responsabilidade, mas diz que não deixa o peso financeiro dominar seus pensamentos, porque se sente em casa e vê sua volta como continuidade de uma história iniciada no clube.\u003cbr\u003e\r\n\u003cbr\u003e\r\nEle ressalta o vínculo afetivo com a torcida e afirma estar pronto para escrever novos capítulos com a camisa rubro-negra, projetando inclusive o dia em que a Nação cantará músicas que o citem em conquistas de Libertadores e Mundial.\u003cbr\u003e"])</script><script>self.__next_f.push([1,"222:Tdfb,"])</script><script>self.__next_f.push([1,"O Flamengo está eliminado do NBB 2026. Em uma partida extremamente equilibrada e carregada de emoção até os segundos finais, o Rubro-Negro foi derrotado pelo Brasília no jogo 5 das quartas de final e deu adeus à competição nacional de basquete.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA vitória por 82 a 78 colocou o Brasília novamente nas semifinais do NBB após dez anos e transformou o ginásio em cenário de festa histórica para a equipe da capital federal.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nDo lado rubro-negro, porém, o clima foi de frustração profunda após uma série marcada por equilíbrio, tensão e alternância emocional do início ao fim.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nO Flamengo entrou em quadra pressionado após oscilações ao longo da série e voltou a apresentar dificuldades em momentos decisivos da partida eliminatória.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nMesmo contando com elenco experiente e tradição recente no basquete nacional, a equipe carioca sofreu com erros ofensivos nos minutos finais e viu o Brasília crescer emocionalmente diante da própria torcida.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA partida foi tratada por torcedores e analistas como uma das mais intensas destes playoffs do NBB. O confronto teve clima de decisão desde o primeiro quarto, com trocas constantes de liderança no placar e forte equilíbrio defensivo.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nO Brasília conseguiu abrir vantagem importante no terceiro período, mas o Flamengo reagiu nos minutos finais e chegou a encostar novamente no marcador, aumentando ainda mais a dramaticidade do duelo.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nApesar da reação rubro-negra, a equipe da casa conseguiu controlar emocionalmente os instantes decisivos e confirmou a classificação diante de um ginásio completamente tomado pela torcida brasiliense.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA eliminação amplia a pressão sobre o projeto de basquete do Flamengo, tradicionalmente tratado como uma das grandes potências da modalidade no país.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNos bastidores, existe enorme cobrança por resultados justamente pelo investimento realizado pelo clube nos últimos anos e pela expectativa criada em torno do elenco montado para a temporada 2026.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA queda também aumenta a sensação de temporada frustrante para o esporte rubro-negro fora do futebol. Em menos de 24 horas, o clube acumulou eliminações importantes tanto na Copa do Brasil quanto no NBB, ampliando o clima de cobrança entre torcedores.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nNas redes sociais, flamenguistas demonstraram revolta com o desempenho da equipe nos momentos decisivos da série, enquanto torcedores do Brasília celebraram o retorno histórico do clube às semifinais após uma década afastado da elite competitiva do torneio.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nO time da capital federal agora vive um dos momentos mais marcantes de sua história recente no basquete nacional e chega embalado emocionalmente para a próxima fase da competição.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nJá o Flamengo precisará reorganizar rapidamente o planejamento da modalidade para evitar que a eliminação gere ainda mais questionamentos internos.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nA expectativa nos bastidores é de que a diretoria realize avaliações profundas sobre elenco, comissão técnica e estrutura do projeto visando a próxima temporada.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nMesmo com tradição, títulos recentes e enorme peso nacional no basquete brasileiro, o Flamengo encerra sua campanha no NBB cercado de críticas, pressão e sensação de oportunidade desperdiçada.\u003cbr\u003e\r\n\r\n\u003cbr\u003e\r\n\r\nE para um clube acostumado a disputar títulos em todas as modalidades, a eliminação em Brasília deixou marcas pesadas no ambiente rubro-negro."])</script><script>self.__next_f.push([1,"38:[\"$\",\"div\",null,{\"children\":[[\"$\",\"section\",null,{\"children\":[\"$\",\"$L21f
